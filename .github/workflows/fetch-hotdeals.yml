name: Fetch Hotdeals Daily

on:
  schedule:
    # 3시간마다 (UTC 0,3,6,9,12,15,18,21시 = KST 09,12,15,18,21,00,03,06시)
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run RSS fetcher
        run: node scripts/fetch-hotdeals.mjs

      - name: Commit updated hotdeals.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/hotdeals.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore(hotdeals): daily auto update [skip ci]"
            git push
          fi
